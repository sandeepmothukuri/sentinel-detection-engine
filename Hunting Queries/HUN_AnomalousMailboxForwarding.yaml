id: 9b1a4e0d-2c3f-4e7b-8d22-8f5e1d3c9b03
name: HUN - Mailbox Forwarding to External Domain
description: |
  Hypothesis - BEC actors set mailbox-level forwarding (Set-Mailbox
  -ForwardingSmtpAddress) to silently mirror inbound mail to an attacker
  address. Surface every change in 14 days where the destination domain
  differs from the tenant's primary domains.
hypothesis: |
  A compromised mailbox is mirroring inbound mail to an external address via
  Set-Mailbox -ForwardingSmtpAddress / -ForwardingAddress. If true, the actor
  sees every invoice, password reset, and executive thread without touching
  the mailbox from the outside.
requiredTelemetry: |
  OfficeActivity via the Office 365 connector (Exchange workload). Requires
  Exchange admin audit logging enabled; mailbox-level audit is not needed.
tactics:
  - Collection
  - Exfiltration
relevantTechniques:
  - T1114.003
requiredDataConnectors:
  - connectorId: Office365
    dataTypes:
      - OfficeActivity
query: |
  OfficeActivity
  | where TimeGenerated > ago(14d)
  | where Operation in ("Set-Mailbox","Set-ForwardingAddress")
  // Parameters is a dynamic array of {"Name","Value"} objects (capitalised keys).
  // Expand it and read the parameters by name instead of regex-scanning a string
  // rendering of the array — the regex form breaks silently if Microsoft changes
  // the serialisation or parameter ordering.
  | mv-expand p = Parameters
  | extend PName = tostring(p.Name), PValue = tostring(p.Value)
  | where PName in ("ForwardingSmtpAddress", "ForwardingAddress", "DeliverToMailboxAndForward")
  | summarize Params = make_bag(bag_pack(PName, PValue)) by TimeGenerated, UserId, ClientIP, Operation, OfficeObjectId
  | extend ForwardSmtp = tostring(Params.ForwardingSmtpAddress)
  | extend ForwardAddr = tostring(Params.ForwardingAddress)
  // ForwardingSmtpAddress values can arrive as "smtp:user@domain.com" and
  // ForwardingAddress as a proxy address ("SMTP:user@domain.com") or a DN, so
  // strip the protocol prefix and stray quote characters before parsing.
  | extend RawTarget = tostring(coalesce(ForwardSmtp, ForwardAddr))
  | extend Target = replace_regex(RawTarget, @"(?i)^\s*smtp:", "")
  | extend Target = trim(@" \t", replace_string(Target, "\"", ""))
  | where isnotempty(Target)
  | extend TargetDomain = tolower(tostring(split(Target, "@")[1]))
  | extend UserDomain = tolower(tostring(split(UserId, "@")[1]))
  | where isnotempty(TargetDomain) and TargetDomain != UserDomain
  | project TimeGenerated, UserId, Target, TargetDomain, ClientIP, Operation, Params
expectedFindings: |
  - Legitimate forwards to counsel, auditors, or personal addresses (known HR cases).
  - Zero rows is the healthy state for most tenants that block external forwarding.
  - Any forward to a consumer mail domain (gmail/outlook.com/yahoo) deserves a call
    to the mailbox owner.
investigationSteps: |
  1. Call/verify the mailbox owner out-of-band — was the forward intentional?
     Do not remove the forward before making contact; it is the evidence.
  2. Review the mailbox audit log (MailItemsAccessed, InboxRule, New-InboxRule)
     for the same window for signs of compromise.
  3. Check MFA registration and recent sign-ins for the account.
  4. If confirmed malicious: remove the forward, revoke sessions, reset
     credentials, and sweep all mailboxes for external forwards.
escalation: |
  Escalate to L3/IR immediately if the mailbox is executive, finance, or HR, or
  if the forward was set from an unusual IP / without user knowledge.
limitations: |
  The hunt reads Parameters by parameter *name* after mv-expand, so it no longer
  depends on the key order or on the string rendering of the array. It does still
  depend on the parameter being present: some Set-Mailbox operations write only
  the mailbox-level forwarding properties, and mail flow rules (transport rules)
  that redirect mail are a different operation and are not covered here.
  Multi-tenant environments with legitimate cross-domain forwarding need a
  domain allow-list.
version: 1.1.0
metadata:
  author: Sandeep Mothukuri
  validationStatus: static-validation
  testMapping: tests/atomics.yaml
