name: detection-pr-report

on:
  pull_request:
    paths:
      - "Detections/**"
      - "Hunting Queries/**"
      - "tests/atomics.md"
      - "tests/validation/atomics.yaml"
      - "coverage.md"
      - "attack-navigator/layer.json"

# Split into two jobs on purpose. The first job runs code from the pull request
# and therefore holds read-only permissions. The second job holds the write
# permission needed to comment, and runs no pull-request code at all — it only
# consumes the report artefact. A contributor cannot reach the write token by
# editing a script, and `pull_request_target` is not used anywhere.
permissions:
  contents: read

jobs:
  report:
    name: Build detection diff report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Generate the report
        env:
          # Values are passed through the environment, never interpolated into the
          # shell command line.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python scripts/pr_diff_report.py > report.md
          {
            echo ""
            echo "## Validation ledger changes"
            if git diff --quiet "${BASE_SHA}...${HEAD_SHA}" -- tests/atomics.md tests/validation/atomics.yaml; then
              echo "- No validation-ledger changes."
            else
              echo "- \`tests/atomics.md\` or \`tests/validation/atomics.yaml\` changed — verify that any"
              echo "  validation-status move is backed by dated evidence in the ledger."
            fi
            echo ""
            echo "## What CI will check next"
            echo "- \`scripts/ci_validate.py\`: schema, ATT&CK coherence, telemetry-to-connector parity,"
            echo "  entity identifiers, alert-detail placeholders, metadata quality bar, KQL lint."
            echo "- \`pytest\`: rule suite, ledger suite, negative validator tests, Sigma converter."
            echo "- drift: \`coverage.md\`, \`attack-navigator/layer.json\`, \`tests/atomics.md\`."
          } >> report.md
          cat report.md

      - name: Upload the report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: detection-diff-report
          path: report.md
          if-no-files-found: error
          retention-days: 7

  comment:
    name: Post the report as a sticky comment
    needs: report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only comment on pull requests from this repository: the token is not exposed
    # to fork builds, which keeps the write scope away from unreviewed code.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download the report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: detection-diff-report

      - name: Post or update the comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405  # v2.9.4
        with:
          header: detection-diff
          path: report.md
