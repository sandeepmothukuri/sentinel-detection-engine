id: 8a9d3f0c-1b2e-4d6a-9c11-7f4e0c2b8a0c
name: Azure - Key Vault Secret Access Spike Per Identity
description: |
  Detects an identity accessing > 25 distinct Key Vault secrets / keys / certs
  within 1 hour, where that access rate is a statistical outlier against the
  identity's own prior 14 days. Indicator of credential harvesting after
  compromise of an SP / managed identity (Storm-0558-style).
severity: High
status: Available
kind: Scheduled
requiredDataConnectors:
  - connectorId: AzureKeyVault
    dataTypes:
      - AzureDiagnostics
queryFrequency: 1h
# 14d is the platform maximum for a scheduled rule's lookback, so the
# historical baseline window is capped here rather than at 30d.
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
  - Discovery
relevantTechniques:
  - T1555.005
  - T1087.004
query: |
  let abs_threshold = 25;
  let excluded_identities = dynamic([]);
  let baseline =
    AzureDiagnostics
    | where TimeGenerated between (ago(14d) .. ago(1h))
    | where ResourceType == "VAULTS" and ResourceProvider == "MICROSOFT.KEYVAULT"
    | where OperationName has_any ("SecretGet","KeyGet","CertificateGet")
    | extend Identity = coalesce(tostring(identity_claim_upn_s), tostring(identity_claim_appid_g_s))
    | where isnotempty(Identity)
    | summarize HourlyDistinct = dcount(id_s) by Identity, bin(TimeGenerated, 1h)
    | summarize MeanH = avg(HourlyDistinct), StdH = stdev(HourlyDistinct) by Identity;
  AzureDiagnostics
  | where TimeGenerated > ago(1h)
  | where ResourceType == "VAULTS" and ResourceProvider == "MICROSOFT.KEYVAULT"
  | where OperationName has_any ("SecretGet","KeyGet","CertificateGet")
  | extend Identity = coalesce(tostring(identity_claim_upn_s), tostring(identity_claim_appid_g_s))
  | where isnotempty(Identity) and Identity !in (excluded_identities)
  | summarize DistinctSecrets = dcount(id_s), LastAccess = max(TimeGenerated),
              Vaults = make_set(Resource, 10),
              IPs = make_set(CallerIPAddress, 10), Ops = make_set(OperationName, 10)
            by Identity
  | where DistinctSecrets >= abs_threshold
  | join kind=leftouter baseline on Identity
  | extend AnomalyScore = iff(StdH > 0, (todouble(DistinctSecrets) - MeanH) / StdH, 99.0)
  | where AnomalyScore > 3.0 or isnull(MeanH)
  | project TimeGenerated = LastAccess, Identity, DistinctSecrets, MeanH, StdH,
            AnomalyScore, Vaults, IPs, Ops
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Identity
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT12H
    matchingMethod: Selected
    groupByEntities:
      - Account
eventGroupingSettings:
  aggregationKind: SingleAlert
alertDetailsOverride:
  alertDisplayNameFormat: Key Vault secret access spike by {{Identity}}
  alertDescriptionFormat: >-
    {{Identity}} read {{DistinctSecrets}} distinct Key Vault objects in one hour,
    far above its own baseline. Review the vaults and caller addresses before
    assuming rotation tooling.
metadata:
  author: Sandeep Mothukuri
  validationStatus: static-validation
  testMapping: tests/atomics.md
  telemetryDependency: AzureDiagnostics (Azure Key Vault diagnostic settings, enabled for SecretGet/KeyGet/CertificateGet platform logs). Requires the Key Vault connector with AzureDiagnostics mode.
  falsePositives: |
    - Backup, DLP/CSA scanning, or secret-rotation tooling enumerating vaults —
      usually visible as an appid in Identity with a stable pattern.
    - Migration or key-replacement projects.
  tuningGuidance: |
    - Populate excluded_identities with the UPNs/appIds of rotation tooling.
    - Identity resolves to the user UPN first, then the app (client) id; entity
      mapping treats both as Account — triage should distinguish them.
    - abs_threshold of 25 suits small vaults; for vaults with hundreds of secrets
      accessed in bulk by design, rely on the z-score branch instead.
    - The baseline is capped at 14 days because Sentinel rejects a scheduled rule
      queryPeriod above 14d. Identities whose normal pattern is monthly
      (e.g. quarterly rotation tooling) may not have a full cycle in the baseline
      and will fall into the isnull(MeanH) branch — allow-list them by design.
  suppression: |
    No static suppression. Tooling allow-list only.
  expectedVolume: Very low; spikes are rare and high-signal.
version: 1.1.0
