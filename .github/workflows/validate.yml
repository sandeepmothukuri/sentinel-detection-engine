name: validate

on:
  push:
    branches: [main]
  pull_request:
  # Reused as the release gate so the two can never diverge.
  # DO NOT declare secrets here. Naming GITHUB_TOKEN in workflow_call.secrets makes
  # GitHub reject the entire workflow file ("would collide with system reserved
  # name"), which fails every run at startup with zero jobs — push, pull request and
  # the Dependabot PRs alike. It did exactly that on 2026-09-11. The token is taken
  # from the github.token context below instead, which is defined in every trigger,
  # including when this workflow is called by release.yml with `secrets: inherit`.
  # tests/test_workflows.py fails the build if a reserved secret name reappears here.
  workflow_call:

# Least privilege: this workflow reads the repository and uploads an artefact.
# It never writes to the repository, so no job is granted write scope.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static validation and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party and first-party actions are pinned to immutable commit SHAs.
      # The trailing comment records the human-readable version the SHA is from.
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # Installed from requirements.txt, not from a list typed here: the two drifted
      # once already (Pillow and matplotlib were imported by the gates below and
      # installed by nobody), and tests/test_requirements.py now fails if they diverge.
      - name: Install validators
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Secrets scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          # github.token, not secrets.GITHUB_TOKEN: identical value, but defined in
          # every trigger context including workflow_call.
          GITHUB_TOKEN: ${{ github.token }}
        # A secret in a detection repository is an incident, not a warning.
        # continue-on-error is deliberately absent.

      - name: yamllint
        run: yamllint Detections "Hunting Queries" Playbooks .github/workflows

      - name: Rule validation (schema, ATT&CK, telemetry, entities, alert details, metadata, KQL)
        run: python scripts/ci_validate.py

      - name: Validation ledger
        run: python scripts/ci_validate.py --ledger-only

      - name: Python test suite
        run: python -m pytest tests -v

      - name: Lint the workflow files
        # Catches the class of defect that is invisible locally and fatal in CI: bad
        # expressions, mistyped action inputs, shell errors. Added after a workflow
        # file was rejected by GitHub at startup and every run failed with zero jobs.
        run: actionlint -color

      - name: Markdown link check
        run: python scripts/check_links.py

      - name: Regenerate coverage and fail on drift
        run: |
          python scripts/generate_coverage.py
          if ! git diff --exit-code coverage.md attack-navigator/layer.json; then
            echo "::error::coverage.md or attack-navigator/layer.json is stale. Run scripts/generate_coverage.py and commit the result."
            exit 1
          fi

      - name: Regenerate validation ledger and fail on drift
        run: |
          python scripts/generate_atomics_ledger.py
          if ! git diff --exit-code tests/atomics.md; then
            echo "::error::tests/atomics.md is stale. Run scripts/generate_atomics_ledger.py and commit the result."
            exit 1
          fi

      # --check rather than "regenerate and git diff": a rule added without its
      # template produces an *untracked* file, which git diff cannot see. The
      # checker enumerates deploy/ against the rule files, so it catches a missing
      # template, a stale one and an orphaned one alike.
      - name: Verify the ARM templates match the rules
        run: python scripts/generate_arm_templates.py --check

      - name: Regenerate the quality matrix and fail on drift
        run: |
          python scripts/generate_metrics_matrix.py
          if ! git diff --exit-code docs/metrics-matrix.md; then
            echo "::error::docs/metrics-matrix.md is stale. Run scripts/generate_metrics_matrix.py"
            exit 1
          fi

      - name: Check the workbook design preview matches its recorded digest
        run: python scripts/render_design_preview.py --check

      # Redraws every chart in memory and compares the numbers against the recorded
      # ones, then checks each committed PNG against its digest. A chart whose
      # numbers no longer match the rule files fails here rather than misleading a
      # reader for another release.
      - name: Check the generated charts are current
        run: python scripts/render_project_charts.py --check

      - name: Package the metadata-stripped rule YAML
        run: python scripts/package_rules.py

      - name: Upload packaged rules
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sentinel-yaml
          path: dist/sentinel-yaml
          if-no-files-found: error
          retention-days: 14
