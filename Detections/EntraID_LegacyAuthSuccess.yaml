id: 8a9d3f0c-1b2e-4d6a-9c11-7f4e0c2b8a03
name: Entra ID - Successful Legacy Auth Sign-In
description: |
  Detects successful sign-ins over legacy authentication protocols
  (POP, IMAP, SMTP AUTH, MAPI, Exchange ActiveSync without modern auth, etc.).
  Legacy auth bypasses Conditional Access and MFA and is the #1 vector for
  password spray. Successful legacy auth is almost always malicious in estates
  that have fully rolled out modern auth.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - SigninLogs
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
  - DefenseEvasion
  - CredentialAccess
relevantTechniques:
  - T1110
  - T1078.004
query: |
  let legacy_clients = dynamic([
    "Other clients; POP",
    "Other clients; IMAP",
    "Other clients; SMTP",
    "Other clients; MAPI",
    "Other clients; Exchange ActiveSync",
    "Authenticated SMTP",
    "Exchange Web Services",
    "AutoDiscover"
  ]);
  let excluded_users = dynamic([]);
  SigninLogs
  | where TimeGenerated > ago(1h)
  | where ResultType == 0
  | where ClientAppUsed in (legacy_clients)
  | where UserPrincipalName !in (excluded_users)
  | project TimeGenerated, UserPrincipalName, IPAddress, ClientAppUsed,
            AppDisplayName, UserAgent, Location
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: UserPrincipalName
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT12H
    matchingMethod: Selected
    groupByEntities:
      - Account
      - IP
eventGroupingSettings:
  aggregationKind: SingleAlert
metadata:
  author: Sandeep Mothukuri
  validationStatus: static-validation
  testMapping: tests/atomics.md
  telemetryDependency: SigninLogs (Entra ID connector). ClientAppUsed must be populated; Basic Auth must not be fully disabled tenant-wide or the rule will simply never see events.
  falsePositives: |
    - Hardened service accounts (printers, scanners, SMTP relays, monitoring probes,
      legacy LOB integrations) that legitimately still use basic auth.
    - Mail clients on old OS builds before EAS modern-auth upgrade.
  tuningGuidance: |
    - Populate excluded_users with the UPNs of documented basic-auth service accounts.
      Keep that list in change control; every entry must have an owner.
    - Best practice is to block legacy auth with Conditional Access and let this rule
      verify the control instead of tuning it into silence.
  suppression: |
    No static suppression. Handle service accounts via the excluded_users list.
  expectedVolume: Near zero once legacy auth is blocked; spikes indicate CA gaps or password spray success.
version: 1.1.0
