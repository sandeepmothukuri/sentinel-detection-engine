id: 8a9d3f0c-1b2e-4d6a-9c11-7f4e0c2b8a0b
name: Azure - NSG Rule Opens Port to 0.0.0.0/0
description: |
  Detects creation or update of an NSG rule that allows inbound traffic from
  Internet / Any (0.0.0.0/0, *) on a sensitive port (22, 3389, 1433, 3306, 5432,
  6379, 27017, 9200). Common cause of accidental exposure and the precursor to
  brute-force / RCE chains.
severity: High
status: Available
kind: Scheduled
requiredDataConnectors:
  - connectorId: AzureActivity
    dataTypes:
      - AzureActivity
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
  - DefenseEvasion
relevantTechniques:
  - T1190
  - T1686.001
query: |
  let sensitive_ports = dynamic(["22","3389","1433","3306","5432","6379","27017","9200","5984","11211"]);
  let excluded_callers = dynamic([]);
  AzureActivity
  | where TimeGenerated > ago(1h)
  | where OperationNameValue endswith "SECURITYRULES/WRITE"
  | where ActivityStatusValue in ("Success","Succeeded")
  | extend props = parse_json(tostring(Properties))
  | extend reqBody = parse_json(tostring(props.requestbody))
  | extend ruleProps = parse_json(tostring(reqBody.properties))
  | extend SourcePrefix = tostring(ruleProps.sourceAddressPrefix)
  | extend DestPortRange = tostring(ruleProps.destinationPortRange)
  | extend Access = tostring(ruleProps.access)
  | extend Direction = tostring(ruleProps.direction)
  | where Direction =~ "Inbound" and Access =~ "Allow"
  | where SourcePrefix in ("*","0.0.0.0/0","Internet","Any")
  | where DestPortRange in (sensitive_ports) or DestPortRange == "*"
  | where Caller !in (excluded_callers)
  | project TimeGenerated, Caller, CallerIpAddress, ResourceId, ResourceGroup,
            SourcePrefix, DestPortRange, Access, Direction
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Caller
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: CallerIpAddress
  - entityType: AzureResource
    fieldMappings:
      - identifier: ResourceId
        columnName: ResourceId
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT6H
    matchingMethod: Selected
    groupByEntities:
      - AzureResource
eventGroupingSettings:
  aggregationKind: SingleAlert
alertDetailsOverride:
  alertDisplayNameFormat: NSG rule exposes port {{DestPortRange}} to the internet
  alertDescriptionFormat: >-
    {{Caller}} created or updated an NSG rule allowing {{SourcePrefix}} inbound on
    {{DestPortRange}} in resource group {{ResourceGroup}}.
metadata:
  author: Sandeep Mothukuri
  validationStatus: static-validation
  testMapping: tests/atomics.md
  telemetryDependency: AzureActivity (Azure Activity log connector). The NSG rule body is read from Properties.requestbody; note that Azure Activity payloads are occasionally truncated for very large request bodies — port-range rules with many entries may need manual follow-up.
  falsePositives: |
    - Approved bastion / jump-host builds, short-lived lab VMs, and approved
      third-party integrations that legitimately open RDP/SSH.
    - IaC pipelines deploying documented baseline rules.
  tuningGuidance: |
    - Populate excluded_callers with service principals that deploy approved rules
      (every entry needs an owner + change ticket).
    - Trim sensitive_ports to the ports your org actually cares about; "*"
      catch-all remains always-alerting.
    - Destination port ranges written as a span ("3389-3390") are not matched by
      the equality check — extend the where clause with a has scan if your IaC
      emits ranges.
  suppression: |
    No static suppression. Caller-based allow-list only.
  expectedVolume: Low; every incident deserves review because of the direct exposure impact.
version: 1.1.0
